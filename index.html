.qn{display:inline-block;min-width:22px;text-align:center;font-weight:500}

.search input:focus{outline:none}.search:focus-within{box-shadow:0 0 0 2px rgba(143,160,120,.45)}
.addt{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}.addt input[type=text]{flex:1;min-width:200px;border-radius:999px}.addt input[type=date]{width:auto;border-radius:999px}
.tr{display:flex;align-items:center;gap:14px;padding:13px 24px;border-top:1px solid var(--ln)}.tr:first-child{border-top:0}.tr input{width:18px;height:18px;accent-color:var(--sageT)}.tr>span:nth-child(2){flex:1}
.ov{position:fixed;inset:0;background:rgba(43,44,39,.22);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:24px 12px;z-index:5}
.md{background:rgba(250,250,247,.94);border:1px solid #fff;border-radius:28px;box-shadow:0 30px 80px rgba(60,60,40,.18);max-width:640px;width:100%;padding:28px}.md h2{margin-bottom:6px}.md h1{font-size:30px}
.md label{display:block;font-size:12.5px;font-weight:500;color:var(--mut);margin:14px 0 5px}.md label.c{display:flex;gap:8px;align-items:center}.md label.c input{width:auto}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.g2 .full{grid-column:1/-1}
.cs{background:rgba(255,255,255,.75);border:1px solid #fff;border-radius:18px;padding:16px;margin:12px 0}
.ln{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--ln);font-size:13.5px}
.b{display:inline-block;border-radius:999px;padding:2px 10px;font-size:11.5px;font-weight:500;background:rgba(43,44,39,.07)}
.b.late{background:rgba(180,102,74,.13);color:var(--terraT)}.b.sched{background:rgba(201,170,110,.2);color:#6E5520}.b.ok{background:rgba(143,160,120,.2);color:var(--sageT)}
#t{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#F6F5F0;padding:11px 20px;border-radius:999px;font-size:13.5px;opacity:0;transition:.25s;z-index:9;pointer-events:none;max-width:92%}

.foot{margin-top:14px}
@media(max-width:800px){.app{display:block;padding:12px}.side{position:static;width:auto;height:auto;flex-direction:row;align-items:center;overflow-x:auto;padding:6px;border-radius:999px;margin-bottom:6px}
.br,.sync{display:none}.nv{width:auto;white-space:nowrap;flex:none;min-height:40px}.nf{margin:0;padding:0;flex-direction:row}
main{padding:22px 4px 60px}h1{font-size:32px}.cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:24px 0}.card{padding:14px 16px}.card .n{font-size:38px}.nv svg{display:none}.g2{grid-template-columns:1fr}.md{padding:22px}.row{padding:14px 18px}.sub{padding-left:17px}}
</style></head><body>
<div class="fog" aria-hidden="true"><i></i><i></i><i></i></div>
<div class="app"><nav class="side glass" id="nav" aria-label="Menu principal"></nav><main><div id="v"></div></main></div>
<div id="m"></div><div id="t" role="status"></div>
<script>
const $=s=>document.querySelector(s);
const LS={g:k=>{try{return localStorage.getItem(k)}catch(e){return null}},s:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
function f(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
const T=f(new Date());
const D=s=>new Date(s+'T12:00:00'),add=(s,n)=>{const d=D(s);d.setDate(d.getDate()+n);return f(d)},diff=(a,b)=>Math.round((D(a)-D(b))/864e5);
const br=s=>s?s.split('-').reverse().join('/'):'—',sh=s=>s?br(s).slice(0,5):'—',uid=()=>Math.random().toString(36).slice(2,10),esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const B=(t,js,c)=>`<button type="button" class="btn ${c||''}" onclick="${js}">${t}</button>`;
const MES=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
let db=[],X={tar:[],pos:[],est:[],cup:[]},view='hoje',flt='todos',qs='',eq='',ef='todas',cq='',cf='todos',PEND=null;
const PS=['Ativo','Pausado','Alta','Não vai retornar'],PST=['ideia','produzindo','pronto','publicado'];
// regras de acompanhamento
const INT=60,LIM_MESES=7,ENC=3;
const FL={todos:'Todos',acao:'Precisa de ação',d60:'60 dias',msg:'Mensagem 15 dias',chk:'Check-in 30 dias',prox:'Encontro definido',ciclo:'Em ciclo',avulsa:'Avulsa',glp:'GLP-1',pausado:'Pausados',ativos:'Ativos',up:'Próximos 7 dias'};
function toast(m,e){const t=$('#t');t.textContent=m;t.className='s'+(e?' err':'');clearTimeout(t.h);t.h=setTimeout(()=>t.className='',3400)}
const rr=id=>{render();const x=$('#'+id);if(x){x.focus();const n=x.value.length;try{x.setSelectionRange(n,n)}catch(e){}}};
// ---- armazenamento (Google Sheets via Apps Script)
let API=LS.g('api')||'',KEY=LS.g('key')||'',V2=false,OK=false;
const COLS=['tar','pos','est','cup'];
const cache=()=>{LS.s('db',JSON.stringify(db));LS.s('x',JSON.stringify(X))};
const url=()=>API+(API.includes('?')?'&':'?')+'v=2&k='+encodeURIComponent(KEY);
async function post(b){cache();if(!API){toast('Salvo só neste aparelho — configure a sincronização','err');return}
 if(b.col!='pac'&&!V2){toast('Salvo só neste aparelho — atualize o Apps Script para sincronizar','err');return}
 try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({...b,k:KEY})});const j=await r.json();if(j.erro)throw 0;toast(b.action=='del'?'Excluído ✓':b.action=='bulk'?'Importado e sincronizado ✓':'Salvo e sincronizado ✓')}
 catch(e){toast(b.action=='bulk'?'Salvo só neste aparelho — atualize o Apps Script para sincronizar importações':'Salvo só neste aparelho — falha ao sincronizar','err')}}
const save=(p,c)=>post({action:'save',col:c||'pac',item:p,patient:p});
const bulk=c=>post({action:'bulk',col:c,items:X[c]});
// estoque: converte o formato antigo (sabor e caixas de seleção) para o formato da planilha
const nE=s=>s.car!==undefined?s:{...s,car:[s.gl&&'Sem Glúten',s.vg&&'Vegano',s.lc&&'0 Lactose'].filter(Boolean).join(', '),apr:[s.apr,s.sabor&&'sabor '+s.sabor].filter(Boolean).join(' ')};
function norm(){COLS.forEach(k=>X[k]=X[k]||[]);X.est=X.est.map(nE)}
// converte uma vez os retornos marcados no formato antigo (60/90/120) em consultas registradas
function migrar(){let n=0;db.forEach(p=>{let mud=false,ag='';
 p.consults.forEach(c=>{if(!c.fu)return;Object.values(c.fu).forEach(x=>{
  if(x.st=='Realizado'&&x.date&&!p.consults.some(o=>o.date==x.date)){p.consults.push({id:uid(),date:x.date,tipo:'Retorno',glp:c.glp||'Não',entrega:'',proxima:'',msg:true,chk:true,obs:'Retorno registrado no painel antigo'});n++}
  if(x.st=='Agendado'&&x.date>ag)ag=x.date});delete c.fu;mud=true});
 if(mud){const l=last(p);if(ag&&ag>l.date&&!l.proxima)l.proxima=ag;save(p)}});if(n)toast(n+' retorno(s) do formato antigo convertido(s) em consulta')}
function load(){db=JSON.parse(LS.g('db')||'[]');Object.assign(X,JSON.parse(LS.g('x')||'{}'));norm();render();
 if(API)fetch(url()).then(r=>r.json()).then(r=>{if(r.erro)throw 0;V2=!Array.isArray(r);OK=true;
  if(V2){db=r.pac||[];COLS.forEach(k=>{if(!(k in r))return;if(k=='cup'&&!r[k].length&&X[k]&&X[k].length)bulk(k);else X[k]=r[k]});if(!('cup' in r))toast('Atualize o Apps Script para sincronizar os cupons','err')}
  else{db=r;toast('Atualize o Apps Script para sincronizar tarefas, postagens, estoque e cupons','err')}
  norm();migrar();cache();render()}).catch(()=>toast('Sem conexão com a planilha (ou chave incorreta)','err'))}
function cfg(){const u=prompt('Cole a URL do Apps Script (Aplicativo da Web). Deixe vazio para modo local:',API);if(u===null)return;API=u.trim();LS.s('api',API);
 if(API){const k=prompt('Chave de acesso, se você definiu uma no Apps Script. Deixe vazio se não definiu:',KEY);if(k!==null){KEY=k.trim();LS.s('key',KEY)}}load()}
function exp(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({pac:db,...X},null,1)],{type:'application/json'}));a.download='backup-consultorio-'+T+'.json';a.click();toast('Backup baixado ✓')}
// ---- regras dos pacientes
// Intervalo base de 60 dias desde a ÚLTIMA consulta (avulsa ou ciclo). Ciclo = 3 encontros, até 7 meses a partir do 1º.
const addM=(s,n)=>{const d=D(s);d.setMonth(d.getMonth()+n);return f(d)};
const TL={Avulsa:'Consulta avulsa / inicial',Retorno:'Retorno',Ciclo:'Ciclo de acompanhamento',Plano:'Plano (antigo)'};
const tl=c=>c.tipo=='Ciclo'?`Ciclo · encontro ${+c.enc||1}/${ENC}`:(TL[c.tipo]||c.tipo||'—');
const last=p=>[...p.consults].sort((a,b)=>b.date.localeCompare(a.date))[0]||{};
function ciclo(p){const l=last(p);if(l.tipo!='Ciclo')return null;
 const ini=[...p.consults].filter(c=>c.tipo=='Ciclo'&&(+c.enc||1)==1&&c.date<=l.date).sort((a,b)=>b.date.localeCompare(a.date))[0]||l;
 return{ini:ini.date,fim:addM(ini.date,LIM_MESES),n:+l.enc||1}}
function E(p,c,kind,due,x){const days=diff(due,T),em=days<0?`há ${-days} dias`:days==0?'hoje':`em ${days} dias`;let b,l;
 if(kind=='msg'||kind=='chk'){b=days<=0?'now':days<=7?'up':'far';l=(kind=='msg'?'Mensagem de 15 dias':'Check-in de 30 dias')+(days<=0?' pendente':'')}
 else if(kind=='d60'){b=days<0?'late':days==0?'now':days<=7?'up':'far';l=days<0?`60 dias completos ${em}`:days==0?'Completa 60 dias hoje':`Completa 60 dias ${em}`;if(c.proxima&&c.proxima>=T)l+=` · próximo encontro em ${br(c.proxima)}`}
 else if(kind=='enc'){b=days<0?'late':days<=7?'up':'far';l=days<0?'Encontro previsto não registrado':'Encontro previsto'}
 else if(kind=='cic'){b=days<0?'late':days<=30?'now':'far';l=(days<0?'Ciclo vencido':'Ciclo vence '+em)+` · ${x.n} de ${ENC} encontros`}
 else{b='now';l='3º encontro: decidir próximo passo (renovar ou encerrar)'}
 return{p,c,kind,due,days,b,l,r:{late:0,now:1,up:2,far:3}[b]}}
function evs(p){const o=[];if(p.status!='Ativo')return o;
 p.consults.forEach(c=>{if(c.entrega&&!c.msg)o.push(E(p,c,'msg',add(c.entrega,15)));if(!c.chk)o.push(E(p,c,'chk',add(c.date,30)))});
 const l=last(p);if(l.id){
  if(!l.ok60)o.push(E(p,l,'d60',add(l.date,INT)));
  if(l.proxima&&l.proxima>l.date)o.push(E(p,l,'enc',l.proxima));
  const cy=ciclo(p);if(cy){if(cy.n<ENC)o.push(E(p,l,'cic',cy.fim,cy));else if(!l.dec)o.push(E(p,l,'dec',l.date))}}
 return o.sort((a,b)=>a.r-b.r||a.due.localeCompare(b.due))}

  else if(ch=='\n'||ch=='\r'){if(ch=='\r'&&t[i+1]=='\n')i++;row.push(c);R.push(row);row=[];c=''}else c+=ch}

 const t=e.days<0?`há ${-e.days} dias`:e.days==0?'hoje':`em ${e.days} dias`,
  rot={msg:'15 dias',chk:'30 dias',d60:'60 dias',enc:'Encontro',cic:'Ciclo',dec:'Ciclo 3/3'}[e.kind],
  ex={msg:'prazo '+br(e.due),chk:'prazo '+br(e.due),d60:'última consulta em '+sh(e.c.date),enc:br(e.due)+' ('+t+')',cic:'prazo '+br(e.due),dec:'3º encontro em '+sh(e.c.date)}[e.kind];
 return`<div class="row"><div class="who"><div class="nm"><span class="dot ${e.b=='late'?'late':''}"></span><button type="button" class="lk" onclick="hist('${pi}')">${esc(e.p.nome)}</button></div><div class="sub">${e.l} · ${ex}</div></div><span class="chip ${e.b=='late'?'late':''}">${e.b=='late'?'Atrasado':rot}</span><div class="acts">${a}</div></div>`}
const EXT=['Nenhuma','Uma','Duas','Três','Quatro','Cinco','Seis','Sete','Oito','Nove','Dez'];
function vHoje(){const all=db.flatMap(evs),A=all.filter(e=>e.b=='late'||e.b=='now'),
 tk_=X.tar.filter(t=>!t.ok&&(!t.data||diff(t.data,T)<=0)).sort((a,b)=>(a.data||'').localeCompare(b.data||'')),
 N=A.length+tk_.length,late=A.filter(e=>e.b=='late').length+tk_.filter(t=>t.data&&diff(t.data,T)<0).length,
 d6=A.filter(e=>e.kind=='d60'),
 ex=X.est.filter(s=>+s.qtd>0&&s.val&&diff(s.val,T)<=30).sort((a,b)=>a.val.localeCompare(b.val)),
 wk=X.pos.filter(p=>p.data&&p.st!='publicado'&&diff(p.data,T)>=0&&diff(p.data,T)<=7),
 up=[...all.filter(e=>e.b=='up'&&e.days<=7).map(e=>({k:e.kind=='enc'?'encontro':'paciente',n:e.l.split(' · ')[0]+' · '+e.p.nome,d:e.due})),
  ...X.tar.filter(t=>!t.ok&&t.data&&diff(t.data,T)>0&&diff(t.data,T)<=7).map(t=>({k:'tarefa',n:t.txt,d:t.data})),
  ...wk.map(p=>({k:'post · '+p.st,n:p.fmt+' · '+p.tema,d:p.data}))].sort((a,b)=>a.d.localeCompare(b.d)),
 h=new Date().getHours(),g=h<5?'Boa noite':h<12?'Bom dia':h<18?'Boa tarde':'Boa noite',
 dt=(d=>d[0].toUpperCase()+d.slice(1))(new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'})),
 fr=N==0?'Nada pede a sua atenção agora.':(N<=10?EXT[N]:N)+(N==1?' coisa pede':' coisas pedem')+' a sua atenção.',
 pr=wk.filter(p=>p.st=='pronto').length;
 return`<div class="top"><div><div class="eyebrow">${dt}</div><h1>${g}, Amanda.<br><span class="s">${fr}</span></h1></div>${B('+ Nova tarefa',"go('tar');setTimeout(()=>$('#nt').focus())")}</div>
 <section class="cards" aria-label="Resumo">
 <div class="card glass c1"><small>Pendências hoje</small><span class="n">${N}</span><span class="ft ${late?'wn':''}">${late?late+' atrasada'+(late>1?'s':''):'tudo em dia'}</span></div>
 <div class="card glass"><small>60 dias completos</small><span class="n">${d6.length}</span><span class="ft">${d6.length?esc(d6.map(e=>e.p.nome.split(' ')[0]).slice(0,3).join(', ')):'ninguém hoje'}</span></div>
 <div class="card glass"><small>Amostras a vencer · 30d</small><span class="n">${ex.length}</span><span class="ft">${(v=>v?v+' vencida'+(v>1?'s':'')+' · '+(ex.length-v)+' a vencer':ex.length?'a primeira em '+diff(ex[0].val,T)+' dias':'nada vencendo')(ex.filter(x=>diff(x.val,T)<0).length)}</span></div>
 <div class="card glass"><small>Posts na semana</small><span class="n">${wk.length}</span><span class="ft">${wk.length?pr+' pronto'+(pr==1?'':'s')+' · '+(wk.length-pr)+' em andamento':'nada agendado'}</span></div></section>
 <div class="duo"><section class="panel" aria-label="Precisa da minha atenção"><div class="ph"><h2>Precisa da minha atenção</h2><span class="mu">${N} ite${N==1?'m':'ns'}</span></div>
 ${A.map(ev).join('')}${tk_.map(t=>`<div class="row"><div class="who"><div class="nm"><span class="dot task"></span>${esc(t.txt)}</div><div class="sub">Tarefa · ${t.data?when(t.data):'sem data'}</div></div><span class="chip">Tarefa</span><div class="acts">${B('Feita',`tk('${t.id}')`)}</div></div>`).join('')}${N?'':'<div class="empty">Nada pendente agora.</div>'}</section>
 <section class="panel soft" aria-label="Próximos 7 dias"><div class="ph"><h2>Próximos 7 dias</h2></div>
 ${up.length?up.map(x=>{const d=D(x.d);return`<div class="tl"><div class="d"><b>${String(d.getDate()).padStart(2,'0')}</b><span>${MES[d.getMonth()]}</span></div><div class="t"><span>${esc(x.n)}</span><span class="meta">${esc(x.k)} · ${when(x.d)}</span></div></div>`}).join(''):'<div class="empty">Nada previsto.</div>'}</section></div>`}
function vPac(){const n=k=>db.filter(p=>match(p,k)).length,q=key(qs);
 const L=db.filter(p=>match(p,flt)&&key(p.nome).includes(q)).sort((a,b)=>((nxt(a)||{due:'9'}).due).localeCompare((nxt(b)||{due:'9'}).due));
 return`<div class="top"><div><div class="eyebrow">${n('ativos')} em acompanhamento</div><h1>Pacientes</h1></div><div class="acts">${impBtn('imp')}${B('+ Novo paciente','abrirForm()','pri')}</div></div>
 <div class="tools">${srch('q','Buscar paciente',qs,'qs')}${chips(FL,flt,'flt',n)}</div>
 <div class="panel"><table><thead><tr><th>Nome</th><th>Última consulta</th><th>Atendimento</th><th>GLP-1</th><th>Próximo acompanhamento</th><th>Data</th><th>Status</th></tr></thead><tbody>
 ${L.map(p=>{const l=last(p),x=nxt(p);return`<tr class="cl" onclick="hist('${p.id}')"><td><b>${esc(p.nome)}</b></td><td class="mu nw">${br(l.date)}</td><td>${l.id?tl(l):'—'}</td><td class="mu">${l.glp||'—'}</td><td>${x?`<span class="dl"><span class="dot ${x.b=='late'?'late':x.b=='up'||x.b=='far'?'far':''}"></span>${x.l}</span>`:'<span class="mu">—</span>'}</td><td class="nw ${x&&x.b=='late'?'wn':'mu'}">${x?sh(x.due):'—'}</td><td><span class="chip ${p.status=='Ativo'?'ok':''}">${p.status}</span></td></tr>`}).join('')||'<tr><td colspan="7" class="empty">Nenhum paciente encontrado.</td></tr>'}
 </tbody></table></div><div class="mu foot">Importar CSV de pacientes — colunas: nome, data consulta, tipo, glp1, entrega, próxima, status</div>`}
function vTar(){const row=t=>`<div class="tr"><input type="checkbox" aria-label="Concluir tarefa" ${t.ok?'checked':''} onchange="tk('${t.id}')"><span class="${t.ok?'dn':''}">${esc(t.txt)}</span><span class="mu nw">${t.data?(!t.ok&&diff(t.data,T)<0?'<b class="wn">atrasada</b> ':'')+sh(t.data):''}</span><button type="button" class="btn q" aria-label="Excluir tarefa" onclick="rm('tar','${t.id}')">✕</button></div>`;
 const P_=X.tar.filter(t=>!t.ok).sort((a,b)=>(a.data||'').localeCompare(b.data||'')),Dn=X.tar.filter(t=>t.ok);
 return`<div class="top"><div><div class="eyebrow">${P_.length} pendente${P_.length==1?'':'s'}</div><h1>Minhas tarefas</h1></div></div>
 <div class="addt"><input type="text" id="nt" placeholder="Nova tarefa…" aria-label="Nova tarefa" onkeydown="if(event.key=='Enter')addT()"><input type="date" id="nd" value="${T}" aria-label="Data da tarefa">${B('Adicionar','addT()','pri')}</div>
 <div class="panel">${P_.map(row).join('')||'<div class="empty">Nenhuma tarefa pendente.</div>'}</div>${Dn.length?`<h3 class="sec">Concluídas</h3><div class="panel soft">${Dn.map(row).join('')}</div>`:''}`}
function vPos(){const L=[...X.pos].sort((a,b)=>(a.data||'9').localeCompare(b.data||'9'));
 return`<div class="top"><div><div class="eyebrow">${X.pos.filter(p=>p.st!='publicado').length} em aberto</div><h1>Postagens</h1></div>${B('+ Nova postagem',"gOpen('pos')",'pri')}</div>
 <div class="panel"><table><thead><tr><th>Data</th><th>Formato</th><th>Tema</th><th>Status</th></tr></thead><tbody>${L.map(p=>`<tr class="cl" onclick="gOpen('pos','${p.id}')"><td class="nw">${sh(p.data)}</td><td><span class="tag">${esc(p.fmt)}</span></td><td>${esc(p.tema)}</td><td><button type="button" class="chip ${p.st=='publicado'?'ok':p.st=='pronto'?'warn':''}" onclick="event.stopPropagation();cyc('${p.id}')">${esc(p.st)}</button></td></tr>`).join('')||'<tr><td colspan="4" class="empty">Nenhuma postagem planejada.</td></tr>'}</tbody></table></div>
 <div class="mu foot">Clique no status para avançar: ideia → produzindo → pronto → publicado.</div>`}
const EF={todas:['Todas',s=>1],est:['Em estoque',s=>+s.qtd>0],v30:['Vencem em 30 dias',s=>+s.qtd>0&&s.val&&diff(s.val,T)>=0&&diff(s.val,T)<=30],venc:['Vencidas',s=>+s.qtd>0&&s.val&&diff(s.val,T)<0],zero:['Esgotadas',s=>!(+s.qtd>0)]};
function vEst(){const q=key(eq),A=X.est,tot=A.reduce((a,s)=>a+(+s.qtd||0),0);
 const L=sEst(A.filter(s=>EF[ef][1](s)&&(!q||key([s.prod,s.ativo,s.marca,s.cat,s.apr,s.car].join(' ')).includes(q))));
 const vv=s=>{if(!s.val)return'<span class="mu">—</span>';const n=diff(s.val,T);return`${br(s.val)}${n<0&&+s.qtd>0?' <span class="chip late">vencida</span>':n>=0&&n<=30&&+s.qtd>0?` <span class="chip warn">${n}d</span>`:''}`};
 return`<div class="top"><div><div class="eyebrow">${A.length} itens · ${tot} unidades</div><h1>Estoque de amostras</h1></div><div class="acts">${impBtn('impEst')}${B('Exportar CSV','expEst()')}${B('+ Nova amostra',"gOpen('est')",'pri')}</div></div>
 <div class="tools">${srch('eq','Buscar produto, ativo, marca, categoria',eq,'eq')}${chips(EF,ef,'ef',k=>A.filter(EF[k][1]).length)}</div>
 <div class="panel est"><table><thead><tr><th>Produto</th><th>Marca</th><th>Categoria</th><th>Apresentação</th><th>Características</th><th>Validade</th><th>Qtd</th></tr></thead><tbody>
 ${L.map(s=>`<tr class="cl ${+s.qtd>0?'':'zero'}" onclick="gOpen('est','${s.id}')"><td><b>${esc(s.prod)}</b>${s.ativo?`<div class="mu clamp" title="${esc(s.ativo)}">${esc(s.ativo)}</div>`:''}</td><td>${esc(s.marca)||'—'}</td><td>${esc(s.cat)||'—'}</td><td>${esc(s.apr)||'—'}</td><td>${tags(s.car)}</td><td class="nw">${vv(s)}</td><td class="nw" onclick="event.stopPropagation()"><button type="button" class="btn q" aria-label="Diminuir estoque" onclick="qty('${s.id}',-1)">−</button> <span class="qn">${+s.qtd||0}</span> <button type="button" class="btn q" aria-label="Aumentar estoque" onclick="qty('${s.id}',1)">+</button></td></tr>`).join('')||'<tr><td colspan="7" class="empty">Nenhuma amostra encontrada.</td></tr>'}
 </tbody></table></div><div class="mu foot">Ordenado pela validade mais próxima. O CSV usa as mesmas colunas da sua planilha: Produto, Ativo, Marca, Categoria, Apresentação, Características, Validade e Estoque.</div>`}
const CF={todos:['Todos',c=>1],Ativo:['Ativos',c=>c.st=='Ativo'],Aguardando:['Aguardando',c=>c.st=='Aguardando'],Inativo:['Inativos',c=>c.st=='Inativo']};
function vCup(){const q=key(cq),A=X.cup,L=sCup(A.filter(c=>CF[cf][1](c)&&(!q||key([c.marca,c.cpac,c.cpes,c.obs].join(' ')).includes(q))));
 const code=(v,cp)=>!v?'<span class="mu">—</span>':/\s|^\?$|^aguardando$/i.test(v)?`<span class="mu">${esc(v)}</span>`:`<span class="code">${esc(v)}</span>${cp?` <button type="button" class="btn q" aria-label="Copiar cupom ${esc(v)}" onclick="event.stopPropagation();cpy('${esc(v)}')">copiar</button>`:''}`;
 return`<div class="top"><div><div class="eyebrow">${A.filter(c=>c.st=='Ativo').length} ativos · ${A.filter(c=>c.st=='Aguardando').length} aguardando</div><h1>Cupons</h1></div><div class="acts">${impBtn('impCup')}${B('Exportar CSV','expCup()')}${B('+ Novo cupom',"gOpen('cup')",'pri')}</div></div>
 <div class="tools">${srch('cq','Buscar marca ou cupom',cq,'cq')}${chips(CF,cf,'cf',k=>A.filter(CF[k][1]).length)}</div>
 <div class="panel"><table><thead><tr><th>Marca</th><th>Cupom do paciente</th><th>%</th><th>Cupom pessoal</th><th>%</th><th>Criado em</th><th>Validade</th><th>Status</th></tr></thead><tbody>
 ${L.map(c=>`<tr class="cl ${c.st=='Inativo'?'zero':''}" onclick="gOpen('cup','${c.id}')"><td><b>${esc(c.marca)}</b>${c.obs?`<div class="mu clamp">${esc(c.obs)}</div>`:''}</td><td class="nw">${code(c.cpac,1)}</td><td class="nw">${esc(c.ppac)||'<span class="mu">—</span>'}</td><td class="nw">${code(c.cpes)}</td><td class="nw">${esc(c.ppes)||'<span class="mu">—</span>'}</td><td class="mu nw">${c.cri?br(c.cri):'—'}</td><td class="mu">${esc(c.vald)||'—'}</td><td><span class="chip ${c.st=='Ativo'?'ok':c.st=='Aguardando'?'warn':''}">${c.st}</span></td></tr>`).join('')||'<tr><td colspan="8" class="empty">Nenhum cupom encontrado.</td></tr>'}
 </tbody></table></div><div class="mu foot">Clique em "copiar" para copiar o cupom do paciente e colar na mensagem.</div>`}

 $('#v').innerHTML=({hoje:vHoje,tar:vTar,pac:vPac,pos:vPos,est:vEst,cup:vCup})[view]()}

function imp(file){if(!file)return;file.text().then(t=>{const ls=csvP(t);
 const tp=s=>/ciclo/i.test(s)?'Ciclo':/plano/i.test(s)?'Plano':/retorno/i.test(s)?'Retorno':'Avulsa';let ct=0;
 ls.slice(1).forEach(c=>{c=c.map(x=>x.trim());if(!c[0]||!dBR(c[1]))return;
  let p=db.find(p=>p.nome.toLowerCase()==c[0].toLowerCase());if(!p){p={id:uid(),nome:c[0],status:PS.find(s=>s.toLowerCase()==(c[6]||'').toLowerCase())||'Ativo',consults:[]};db.push(p)}
  p.consults.push({id:uid(),date:dBR(c[1]),tipo:tp(c[2]),glp:/^s/i.test(c[3])?'Sim':'Não',entrega:dBR(c[4])||dBR(c[1]),proxima:dBR(c[5]),msg:false,chk:false,obs:''});ct++});
 db.forEach(p=>save(p));toast(ct+' consultas importadas ✓');render()})}
