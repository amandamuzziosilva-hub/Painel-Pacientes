<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;500;600&family=DM+Mono&display=swap" rel="stylesheet">
<style>
:root{--bg:#EFEEE8;--ink:#2B2C27;--mut:#6B6C63;--soft:#8A8B82;--ln:rgba(43,44,39,.07);--glass:rgba(255,255,255,.5);--glass2:rgba(255,255,255,.72);--edge:rgba(255,255,255,.9);--sage:#8FA078;--sageT:#45523A;--terra:#B4664A;--terraT:#8E3F24;--far:#CFC7B6;--r:24px}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 'Hanken Grotesk',system-ui,sans-serif;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
.fog{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.fog i{position:absolute;border-radius:50%;filter:blur(30px)}
.fog i:nth-child(1){top:-180px;right:-120px;width:760px;height:620px;background:radial-gradient(closest-side,#C3CDB0,rgba(239,238,232,0))}
.fog i:nth-child(2){bottom:-220px;left:180px;width:700px;height:520px;background:radial-gradient(closest-side,#E4DCCB,rgba(239,238,232,0))}
.fog i:nth-child(3){top:42%;right:22%;width:420px;height:320px;filter:blur(20px);background:radial-gradient(closest-side,#F7F6F1,rgba(239,238,232,0))}
.app{position:relative;z-index:1;display:flex;gap:16px;padding:16px;min-height:100vh}
.glass{background:var(--glass);border:1px solid var(--edge);-webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px)}
.side{width:204px;flex:none;border-radius:26px;padding:24px 10px 16px;display:flex;flex-direction:column;gap:4px;position:sticky;top:16px;height:calc(100vh - 32px);overflow:auto;background:rgba(255,255,255,.42)}
.br{padding:2px 10px 26px}.br img{display:block;width:150px;height:auto}
.nv{display:flex;align-items:center;gap:11px;width:100%;min-height:44px;padding:0 12px;border:0;border-radius:999px;background:none;text-align:left;cursor:pointer;font-size:15px}
.nv svg{flex:none;color:var(--mut)}.nv:hover{background:rgba(255,255,255,.5)}
.nv.on{background:rgba(255,255,255,.92);box-shadow:0 1px 2px rgba(60,60,40,.05),0 6px 18px rgba(80,85,60,.06);font-weight:500}.nv.on svg{color:var(--ink)}
.nf{margin-top:auto;padding-top:24px;display:flex;flex-direction:column;gap:2px}.nf .nv{font-size:14px;color:var(--mut)}
.sync{display:flex;align-items:center;gap:8px;padding:10px 14px 0;font:11px 'DM Mono',monospace;letter-spacing:.04em;text-transform:uppercase;color:var(--mut)}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--far)}.sync.ok i{background:var(--sage)}
main{flex:1;min-width:0;padding:40px 20px 70px;max-width:1280px}
.eyebrow{font:12px 'DM Mono',monospace;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin-bottom:6px}
h1{margin:0;font-size:46px;line-height:1.12;font-weight:300;letter-spacing:-.025em}h1 .s{color:var(--soft)}
h2{margin:0;font-size:19px;font-weight:500;letter-spacing:-.01em}
.sec{margin:30px 0 12px;font-size:16px;font-weight:500;color:var(--mut)}
.mu{color:var(--mut);font-size:13.5px}.wn{color:var(--terraT)}.dn{text-decoration:line-through;color:var(--mut)}.nw{white-space:nowrap}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:26px}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.acts.sp{justify-content:space-between;margin-top:20px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:0 16px;border-radius:999px;border:1px solid rgba(255,255,255,.95);background:rgba(255,255,255,.7);cursor:pointer;font-size:14px;white-space:nowrap}
.btn:hover{background:#fff}.btn.pri{background:var(--ink);color:#F6F5F0;border-color:var(--ink)}.btn.pri:hover{background:#3d3e37}
.btn.q{min-height:32px;padding:0 11px;font-size:13px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin:32px 0}
.card{padding:20px 22px;border-radius:22px;display:flex;flex-direction:column;gap:10px}
.card.c1{background:var(--glass2);border-color:rgba(255,255,255,.95);box-shadow:0 1px 2px rgba(60,60,40,.04),0 14px 34px rgba(80,85,60,.07)}
.card small{font:11px 'DM Mono',monospace;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.card .n{font-size:52px;line-height:1;font-weight:300;letter-spacing:-.03em}.card .ft{font-size:13px;color:var(--mut)}
.duo{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}.duo>.panel:first-child{flex:2 1 520px}.duo>.panel:last-child{flex:1 1 280px}
.panel{border-radius:var(--r);overflow-x:auto;background:var(--glass);border:1px solid var(--edge);-webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px)}
.panel.soft{background:rgba(255,255,255,.32)}
.ph{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:22px 24px 14px}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:12px 18px;padding:16px 24px;border-top:1px solid var(--ln)}
.who{flex:1 1 240px;min-width:0;display:flex;flex-direction:column;gap:4px}.nm{display:flex;align-items:center;gap:10px;font-size:16px;font-weight:500}
.sub{padding-left:17px;font-size:14px;color:var(--mut)}
.lk{border:0;background:none;padding:0;cursor:pointer;font-weight:500;text-align:left}.lk:hover{color:var(--sageT)}
.dot{flex:none;width:7px;height:7px;border-radius:50%;background:var(--sage)}.dot.late{background:var(--terra)}.dot.far{background:var(--far)}.dot.task{border-radius:2px;background:#C9BFAE}
.dl{display:inline-flex;align-items:center;gap:8px}
.chip{display:inline-block;padding:3px 11px;border-radius:999px;background:rgba(43,44,39,.07);color:#3F4039;font-size:12px;font-weight:500;white-space:nowrap}
.chip.late{background:rgba(180,102,74,.13);color:var(--terraT)}.chip.ok{background:rgba(143,160,120,.2);color:var(--sageT)}.chip.warn{background:rgba(201,170,110,.2);color:#6E5520}
button.chip{border:0;cursor:pointer}button.chip.on{background:var(--ink);color:#F6F5F0}
.tl{display:flex;gap:16px;align-items:flex-start;padding:14px 22px;border-top:1px solid var(--ln)}
.tl .d{flex:none;width:44px;display:flex;flex-direction:column;align-items:center}.tl .d b{font-size:22px;font-weight:300;line-height:1}.tl .d span,.meta{font:11px 'DM Mono',monospace;letter-spacing:.05em;text-transform:uppercase;color:var(--mut)}
.tl .t{display:flex;flex-direction:column;gap:3px}
.tools{display:flex;flex-direction:column;gap:14px;margin-bottom:18px}
.search{display:flex;align-items:center;gap:10px;max-width:440px;min-height:48px;padding:0 18px;border-radius:999px;background:rgba(255,255,255,.6);border:1px solid rgba(255,255,255,.95)}
.search input{flex:1;min-width:0;border:0;background:transparent;font-size:15px;outline:none;padding:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.chips{display:flex;gap:8px;flex-wrap:wrap}.chips .btn{min-height:36px;padding:0 15px;font-size:13px;background:rgba(255,255,255,.35);border-color:rgba(255,255,255,.8)}

.qn{display:inline-block;min-width:22px;text-align:center;font-weight:500}

 else if(kind=='enc'){b=days<0?'late':days<=7?'up':'far';l=days<0?'Consulta agendada ainda não registrada':'Retorno agendado'}
 else if(kind=='cic'){b=days<0?'late':days<=30?'now':'far';l=(days<0?'Ciclo vencido':'Prazo do ciclo')+` · ${x.n} de ${ENC} encontros`}
 else{b='now';l='3º encontro: decidir próximo passo (renovar ou encerrar)'}
 return{p,c,kind,due,days,b,l,r:{late:0,now:1,rem:2,up:3,far:4}[b]}}
function evs(p){const o=[];if(p.status!='Ativo')return o;

// ---- planilhas (CSV)
function csvP(t){t=t.replace(/^﻿/,'');const h=t.split(/\r?\n/)[0],sep=(h.match(/;/g)||[]).length>(h.match(/,/g)||[]).length?';':',';
 const R=[];let row=[],c='',q=false;
 for(let i=0;i<t.length;i++){const ch=t[i];
  if(q){if(ch=='"'){if(t[i+1]=='"'){c+='"';i++}else q=false}else c+=ch}
  else if(ch=='"')q=true;else if(ch==sep){row.push(c);c=''}
  else if(ch=='\n'||ch=='\r'){if(ch=='\r'&&t[i+1]=='\n')i++;row.push(c);R.push(row);row=[];c=''}else c+=ch}
 if(c||row.length){row.push(c);R.push(row)}return R.filter(r=>r.some(x=>x.trim()))}
const csvQ=v=>{v=String(v==null?'':v);return /[",;\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
function csvD(nome,rows){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['﻿'+rows.map(r=>r.map(csvQ).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'}));a.download=nome;a.click();toast('Planilha baixada ✓')}
const dBR=s=>{s=(s||'').trim();const m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/);return m?(m[3].length==2?'20'+m[3]:m[3])+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0'):/^\d{4}-\d\d-\d\d$/.test(s)?s:''};
const brF=s=>s?s.split('-').reverse().join('/'):'';
const key=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim();
const impBtn=fn=>`<label class="btn">Importar CSV<input type="file" accept=".csv,text/csv" hidden onchange="${fn}(this.files[0]);this.value=''"></label>`;
function askImp(c,L){if(!L.length)return toast('Nenhuma linha válida encontrada no arquivo','err');PEND={c,L};const n=X[c].length,t=c=='est'?'amostras':'cupons';
 $('#m').innerHTML=`<div class="ov"><div class="md"><h2>Importar planilha</h2><p class="mu">Encontrei <b>${L.length} ${t}</b> no arquivo.${n?` O painel tem ${n} ${n==1?t.slice(0,-1):t} hoje.`:''}</p>
 ${n?`<p class="mu"><b>Substituir tudo</b> apaga a lista atual e coloca a da planilha no lugar. <b>Adicionar</b> mantém a lista atual e inclui as linhas da planilha no final.</p>`:''}
 <div class="acts sp"><span>${B('Cancelar','cl()')}</span><span class="acts">${n?B('Adicionar','doImp(0)'):''}${B(n?'Substituir tudo':'Importar','doImp(1)','pri')}</span></div></div></div>`}
function doImp(rep){const{c,L}=PEND;X[c]=rep?L:X[c].concat(L);PEND=null;
 if(c=='est'){L.forEach(s=>{addOpt('marca',s.marca,1);addOpt('cat',s.cat,1);splitC(s.car).forEach(x=>addOpt('car',x,1))});['marca','cat','car'].forEach(id=>save(OL(id),'opt'))}
 cl();render();bulk(c)}

const CAR0=['Sem Glúten','Contém Glúten','Vegano','0 Açúcar','0 Lactose','FODMAP Friendly','Sem cafeína'];
const PAL=[['#F6E7B8','#6B5310'],['#F4CDBF','#8A3A1F'],['#D6E8C8','#3E5A2A'],['#E4E2DB','#45453F'],['#CFE3E6','#2F5A61'],['#E6DAF0','#5A3F72'],['#6B4A2E','#FBEFE3'],['#F3D9E4','#7A3552'],['#DCE3F3','#34477A'],['#EFE1CF','#6B4E2A']];
const splitC=s=>(s||'').split(',').map(x=>x.trim()).filter(Boolean);
function OL(id){let o=X.opt.find(i=>i.id==id);if(!o){
 o={id,vals:id=='car'?CAR0.map((n,c)=>({n,c})):[...new Set(X.est.map(s=>(s[id]||'').trim()).filter(Boolean))].sort(cmp).map(n=>({n}))};X.opt.push(o)}return o}

function addOpt(id,n,quiet){n=(n||'').trim();if(!n)return;const o=OL(id);if(o.vals.some(v=>key(v.n)==key(n)))return;
 const v={n};if(id=='car')v.c=o.vals.reduce((m,x)=>Math.max(m,x.c==null?-1:x.c),-1)+1;o.vals.push(v);if(id!='car')o.vals.sort((a,b)=>cmp(a.n,b.n));if(!quiet)save(o,'opt')}
function rmOpt(id,n){const u=X.est.filter(s=>id=='car'?splitC(s.car).includes(n):s[id]==n).length;

 const o=OL(id);o.vals=o.vals.filter(v=>v.n!=n);save(o,'opt');lists(id)}
const carS=n=>{const v=OL('car').vals.find(x=>x.n==n),p=v&&v.c!=null?PAL[v.c%PAL.length]:['rgba(43,44,39,.07)','#3F4039'];return`background:${p[0]};color:${p[1]}`};

function novaCar(btn){const n=(prompt('Nova característica:')||'').trim();if(!n)return;const ex=ON('car').find(x=>key(x)==key(n));if(!ex)addOpt('car',n);const v=ex||n;

// estoque
function impEst(file){if(!file)return;file.text().then(t=>{const R=csvP(t);if(R.length<2)return toast('Planilha vazia','err');
 const h=R[0].map(key),ix=(ns,d)=>{const i=h.findIndex(x=>ns.some(n=>x.startsWith(n)));return i>=0?i:d};
 const I={prod:ix(['produto'],0),ativo:ix(['ativo'],1),marca:ix(['marca'],2),cat:ix(['categoria'],3),apr:ix(['apresenta'],4),car:ix(['caracter'],5),val:ix(['validade'],6),qtd:ix(['estoque','quant','qtd'],7)};
 askImp('est',R.slice(1).map(r=>{const g=k=>(r[I[k]]||'').trim();return{id:uid(),prod:g('prod'),ativo:g('ativo'),marca:g('marca'),cat:g('cat'),apr:g('apr'),car:splitC(g('car')).join(', '),val:dBR(g('val')),qtd:Math.max(0,parseInt(g('qtd'),10)||0)}}).filter(x=>x.prod))})}

function expEst(){csvD('Controle de Amostras - '+brF(T).replace(/\//g,'-')+'.csv',[['Produto','Ativo','Marca','Categoria','Apresentação','Características','Validade','Estoque'],...sEst(X.est).map(s=>[s.prod,s.ativo,s.marca,s.cat,s.apr,s.car,brF(s.val),+s.qtd||0])])}

function impCup(file){if(!file)return;file.text().then(t=>{const R=csvP(t);if(R.length<2)return toast('Planilha vazia','err');
 const h=R[0].map(key),si=h.findIndex(x=>x.startsWith('site')),pi=h.findIndex(x=>x.startsWith('na pagina'));

  o.st=CST.includes(g(8))?g(8):(o.cpac||(o.cpes&&!/^(aguardando|\?)$/i.test(o.cpes)))?'Ativo':'Aguardando';return o}).filter(x=>x.marca))})}

 ${L.map(s=>`<tr class="cl ${+s.qtd>0?'':'zero'}" onclick="gOpen('est','${s.id}')"><td><b>${esc(s.prod)}</b>${s.ativo?`<div class="mu clamp" title="${esc(s.ativo)}">${esc(s.ativo)}</div>`:''}</td><td>${esc(s.marca)||'—'}</td><td>${esc(s.cat)||'—'}</td><td>${esc(s.apr)||'—'}</td><td>${splitC(s.car).map(ctag).join('')||'<span class="mu">—</span>'}</td><td class="nw">${vv(s)}</td><td class="nw" onclick="event.stopPropagation()"><button type="button" class="btn q" aria-label="Diminuir estoque" onclick="qty('${s.id}',-1)">−</button> <span class="qn">${+s.qtd||0}</span> <button type="button" class="btn q" aria-label="Aumentar estoque" onclick="${+s.qtd>0?`qty('${s.id}',1)`:`repor('${s.id}')`}">+</button></td></tr>`).join('')||'<tr><td colspan="7" class="empty">Nenhuma amostra encontrada.</td></tr>'}
 </tbody></table></div><div class="mu foot">Mostra só o que tem estoque, da validade mais próxima para a mais distante. Ao zerar uma amostra, a validade é apagada e ela vai para "Esgotadas"; para repor, clique em + e informe a validade do novo lote. O CSV usa as mesmas colunas da sua planilha: Produto, Ativo, Marca, Categoria, Apresentação, Características, Validade e Estoque.</div>`}

 return`<div class="top"><div><div class="eyebrow">${A.filter(c=>c.st=='Ativo').length} ativos · ${A.filter(c=>c.st=='Aguardando').length} aguardando</div><h1>Cupons</h1></div><div class="acts">${impBtn('impCup')}${B('Exportar CSV','expCup()')}${B('+ Novo cupom',"gOpen('cup')",'pri')}</div></div>

 </tbody></table></div><div class="mu foot">Clique no ícone ao lado do cupom do paciente para copiar e colar na mensagem. A página das pacientes mostra só as marcas com "Na página" ligado, com status Ativo e com cupom do paciente.</div>`}

 const tp=s=>/ciclo/i.test(s)?'Ciclo':/plano/i.test(s)?'Plano':/retorno/i.test(s)?'Retorno':'Avulsa';let ct=0;
